apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-management-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Avejlanjekar/employee-management-helm-cicd.git
    targetRevision: main
    path: helm/employee-management
    helm:
      valueFiles:
        - values-uat.yaml
  destination:
    server: https://5464409556A49BBBB95A8D13E25F0345.gr7.ap-south-1.eks.amazonaws.com
    namespace: employee-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
