apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-management-backend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Avejlanjekar/employee-management-helm-cicd.git
    targetRevision: main
    path: helm/employee-management
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: component
          value: backend
  destination:
    server: arn:aws:eks:ap-south-1:916921211430:cluster/employee-management-eks-dev
    namespace: employee-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true